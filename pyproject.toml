[project]
name = "personal-ai-hub"
version = "0.0.1"
description = "Private modular personal assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "pydantic==2.13.5",
  "sqlalchemy==2.1.3",
  "alembic==1.20.0",
  "httpx==0.28.1",
  "uvicorn==0.54.0",
  "psycopg[binary]==3.3.6",
  "cryptography==50.0.2",
  "procrastinate==3.10.0",
  "pypdf==6.19.0",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "openpyxl==3.1.5",
  "Pillow==12.3.0",
  "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10", "mypy==2.4.0"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.hatch.build]
exclude = ["/.local", "/.venv", "/.git", "/data", "/secrets", "/vault", "/uploads", "/artifacts", "/.env", "/dist", "/frontend/node_modules"]
