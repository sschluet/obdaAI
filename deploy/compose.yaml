name: obdaai
x-app: &app
  image: obdaai:${HUB_RELEASE:?Set the reviewed Git commit}
  build:
    context: ..
  env_file: /etc/obdaai/runtime.env
  network_mode: host
  user: "10001:10001"
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  extra_hosts:
    - "${HUB_LOCAL_HOST:-inference.invalid}:127.0.0.1"
  volumes:
    - /etc/obdaai/secrets/local-inference.key:/run/secrets/local-inference.key:ro
    - /etc/obdaai/secrets/provider-encryption.key:/run/secrets/provider-encryption.key:ro
    - /var/lib/obdaai/sources:/sources
    - /var/lib/obdaai/parser-results:/parser-results:ro
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  db:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    restart: unless-stopped
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
    volumes:
      - hub-db:/var/lib/postgresql
      - /etc/obdaai/secrets/db-password:/run/secrets/db-password:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hub -d hub"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    cpus: 1
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 512m
    cpus: 1
    profiles: [maintenance]
  api:
    <<: *app
    command: [uvicorn, "hub.api:app", --host, "127.0.0.1", --port, "8765", --no-access-log]
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
  worker:
    <<: *app
    command: [python, -m, hub.jobs]
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 2g
    cpus: 2
  source-worker:
    <<: *app
    command: [python, -m, hub.jobs, --sources]
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 512m
    cpus: 1
  parser:
    image: obdaai:${HUB_RELEASE:?Set the reviewed Git commit}
    command: [python, -m, hub.source_runner]
    network_mode: none
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - /var/lib/obdaai/sources:/sources:ro
      - /var/lib/obdaai/parser-results:/results
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  hub-db:
