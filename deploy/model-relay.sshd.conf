# Append at the end of sshd_config after review; not a global Include fragment.
# Dedicated identity only. Key file must be root-owned, with a source-IP restriction.
Match User hub-relay
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/ssh/obdaai-keys/hub-relay
    AllowTcpForwarding local
    AllowStreamLocalForwarding no
    PermitOpen 127.0.0.1:11435
    PermitListen none
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    MaxSessions 0
    ForceCommand /usr/bin/false
