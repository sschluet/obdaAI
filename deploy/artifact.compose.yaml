# Separate offline runner. Only immutable per-job copies, no source/vault/secrets.
services:
  api:
    environment:
      HUB_ARTIFACT_REQUEST_DIR: /artifact-requests
      HUB_ARTIFACT_RESULT_DIR: /artifact-results
    volumes:
      - ${HUB_ARTIFACT_REQUESTS:?Set private request directory}:/artifact-requests:ro
      - ${HUB_ARTIFACT_RESULTS:?Set private result directory}:/artifact-results:ro
  api_https:
    environment:
      HUB_ARTIFACT_REQUEST_DIR: /artifact-requests
      HUB_ARTIFACT_RESULT_DIR: /artifact-results
    volumes:
      - ${HUB_ARTIFACT_REQUESTS:?Set private request directory}:/artifact-requests:ro
      - ${HUB_ARTIFACT_RESULTS:?Set private result directory}:/artifact-results:ro
  # Chat requests enqueue via the same transaction; the chat worker only reads
  # quota/integrity data. Spooling remains exclusive to artifact-worker.
  worker:
    environment:
      HUB_ARTIFACT_REQUEST_DIR: /artifact-requests
      HUB_ARTIFACT_RESULT_DIR: /artifact-results
    volumes:
      - ${HUB_ARTIFACT_REQUESTS:?Set private request directory}:/artifact-requests:ro
      - ${HUB_ARTIFACT_RESULTS:?Set private result directory}:/artifact-results:ro
  artifact-worker:
    image: obdaai:${HUB_RELEASE:?Set reviewed release}
    command: [python, -m, hub.jobs, --artifacts]
    env_file: /etc/obdaai/runtime.env
    environment:
      HUB_ARTIFACT_REQUEST_DIR: /artifact-requests
      HUB_ARTIFACT_RESULT_DIR: /artifact-results
    network_mode: host
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 40
    mem_limit: 256m
    cpus: 0.5
    tmpfs: ["/tmp:size=16m,mode=1777"]
    volumes:
      - /var/lib/obdaai/sources:/sources:ro
      - ${HUB_ARTIFACT_REQUESTS:?Set private request directory}:/artifact-requests:rw
      - ${HUB_ARTIFACT_RESULTS:?Set private result directory}:/artifact-results:ro
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  artifact-runner:
    image: obdaai-artifacts:${HUB_RELEASE:?Set reviewed release}
    restart: unless-stopped
    network_mode: none
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 80
    mem_limit: 1g
    cpus: 1
    tmpfs:
      - /tmp:size=1m,mode=0555
      - /run/ipc:size=1m,mode=0700,uid=10001,gid=10001
    volumes:
      - ${HUB_ARTIFACT_REQUESTS:?Set private request directory}:/requests:ro
      - ${HUB_ARTIFACT_RESULTS:?Set private result directory}:/results:rw
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # Long SSHFS indexing has its own queue; uploads retain a responsive worker.
  vault-worker:
    extends:
      file: compose.yaml
      service: source-worker
    command: [python, -m, hub.jobs, --vault]
    volumes:
      - type: bind
        source: ${HUB_VAULT_MOUNT:?Set reviewed live mount}
        target: /vault
        bind: {propagation: rslave}
