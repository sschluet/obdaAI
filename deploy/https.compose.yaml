# Optional second API endpoint preserves the SSH pilot during TLS acceptance.
services:
  api_https:
    extends:
      file: compose.yaml
      service: api
    env_file:
      - /etc/obdaai/runtime.env
      - /etc/obdaai/https.env
    command: [uvicorn, "hub.api:app", --host, "127.0.0.1", --port, "8766", --no-access-log]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    profiles: [https]
