name: Project website
on:
  push:
    branches: [main, "milestone/**"]
    paths:
      - 'website/**'
      - 'scripts/build_showcase.py'
      - 'scripts/publish_showcase.py'
      - 'frontend/showcase-check.mjs'
      - 'frontend/capture-showcase.mjs'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python scripts/scan_secrets.py
      - run: python -m py_compile scripts/build_showcase.py scripts/publish_showcase.py
      - name: Build public allowlist
        run: python scripts/build_showcase.py --revision "$GITHUB_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.19.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - name: Check website desktop and mobile
        run: |
          python -m http.server 18768 --bind 127.0.0.1 --directory .local/website-build &
          website_pid=$!
          trap 'kill "$website_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18768/ > /dev/null; then break; fi
            sleep 1
          done
          cd frontend
          node showcase-check.mjs
