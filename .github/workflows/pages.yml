name: Project website
on:
  push:
    branches: [main, milestone/m3-actions]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-website
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build public allowlist
        run: python scripts/build_showcase.py --revision "$GITHUB_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.19.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - name: Check website desktop and mobile
        run: |
          python -m http.server 18768 --bind 127.0.0.1 --directory .local/website-build &
          website_pid=$!
          trap 'kill "$website_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18768/ > /dev/null; then break; fi
            sleep 1
          done
          cd frontend
          node showcase-check.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: vars.SHOWCASE_PAGES_ENABLED == 'true'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .local/website-build
  deploy:
    if: vars.SHOWCASE_PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish project website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
