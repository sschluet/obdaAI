name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv==0.12.23
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run mypy backend/hub
      - run: uv run pytest
      - run: uv run python scripts/scan_secrets.py
      - run: uv build
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/src:ro" zricethezav/gitleaks:v8.24.3 git /src --redact --no-banner
