name: checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "milestone/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: hub_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fixture -d hub_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HUB_CI_DATABASE_URL: postgresql+psycopg://fixture:synthetic-ci-only@127.0.0.1:5432/hub_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install uv==0.12.23
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run mypy backend/hub
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-liberation poppler-utils
      - run: uv run pytest
      - run: uv run python scripts/scan_secrets.py
      - run: uv build
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/src:ro" zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 git /src --redact --no-banner

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.19.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - run: pnpm check && pnpm build
        working-directory: frontend
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install uv==0.12.23 && uv sync --locked --all-extras
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - name: Synthetic browser checks
        run: |
          uv run uvicorn scripts.browser_fixture:app --host 127.0.0.1 --port 18765 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18765/api/health > /dev/null; then break; fi
            sleep 1
          done
          uv run python scripts/artifact_ui_inputs.py
          cd frontend
          node fixture-login-check.mjs
          node browser-check.mjs
          node artifact-check.mjs
          node native-provider-check.mjs
          node workspace-check.mjs
          node search-check.mjs
          node search-navigation-check.mjs
          node composer-ux-check.mjs
          node web-preference-check.mjs
          node web-settings-check.mjs
          node processing-check.mjs
          node run-error-check.mjs
          node chat-scroll-check.mjs
          node pipeline-check.mjs
          node workbench-check.mjs
          node task-ux-check.mjs
          node preference-ux-check.mjs
          node template-check.mjs
          node password-check.mjs
          cd ..
          HUB_BROWSER_FIXTURE_DIR=.local/browser uv run python scripts/seed_showcase.py
          cd frontend
          HUB_DESIGN_ORIGIN=http://127.0.0.1:18765 node design-check.mjs
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag obdaai-ci .

  browser-runner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag obdaai-browser-ci browser-runner
      - run: bash browser-runner/smoke.sh

  artifact-runner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --file artifact-runner/Dockerfile --tag obdaai-artifacts-ci .
      - run: bash artifact-runner/smoke.sh
